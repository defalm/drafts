<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Перекуп</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
:root{--bg:#101215;--bg2:#181b20;--card:#1f232a;--card2:#2a2f38;--line:#323843;--txt:#f2f0ea;--mute:#949aa6;--acc:#ffc400;--acc2:#ff9500;--red:#ff5b5b;--green:#35d07f;--blue:#4ea4ff;
--tg-bg:#0e1621;--tg-head:#17212b;--tg-in:#182533;--tg-out:#2b5278;--tg-acc:#5eb5f7;--tg-mute:#6d7f8f;--tg-time-out:#7da8d3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:500 15px/1.35 -apple-system,system-ui,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;vertical-align:middle}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
#top{padding:10px 14px 8px;padding-top:max(10px,env(safe-area-inset-top));background:var(--bg2);border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px}
#money{font-size:27px;font-weight:900;letter-spacing:-.02em;flex:1}
#money small{font-size:16px;color:var(--mute);font-weight:700}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.pill svg.i{width:15px;height:15px}
.pill.debt{color:var(--red);border-color:rgba(255,91,91,.35)}
#lvlbar{height:5px;background:var(--card);border-radius:6px;overflow:hidden;margin-top:8px}
#lvlbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));width:0;transition:width .4s}
#lvltxt{font-size:12px;color:var(--mute);margin-top:4px;display:flex;justify-content:space-between}
#main{flex:1;overflow-y:auto;padding:4px 12px 104px;overscroll-behavior:contain}
.h{font-size:12.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;font-weight:800;margin:14px 2px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.h span:last-child:not(:first-child){text-transform:none;letter-spacing:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:9px;display:flex;gap:11px;align-items:center;width:100%;text-align:left;position:relative}
.card:active{transform:scale(.988)}
.thumb{width:118px;height:66px;flex:0 0 auto;border-radius:11px;background:linear-gradient(180deg,#39404d 0%,#272c35 62%,#1e2229 62.5%,#22262d 100%);display:grid;place-items:center;overflow:hidden}
.thumb svg{width:116%;height:auto;margin-top:4px}
.ci{flex:1;min-width:0}
.ci b{display:block;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci small{display:block;color:var(--mute);font-size:12.5px}
.price{font-weight:900;font-size:17px;color:var(--acc)}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px;margin:4px 4px 0 0;background:var(--card2);color:var(--mute)}
.tag svg.i{width:12px;height:12px}
.tag.r{background:rgba(255,91,91,.14);color:var(--red)}.tag.g{background:rgba(53,208,127,.14);color:var(--green)}.tag.y{background:rgba(255,196,0,.14);color:var(--acc)}.tag.b{background:rgba(78,164,255,.14);color:var(--blue)}
.empty{color:var(--mute);text-align:center;padding:28px 12px;font-size:14px}
.slot{border:2px dashed var(--line);border-radius:16px;padding:16px;text-align:center;color:var(--mute);margin-bottom:9px}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;gap:3px;margin:10px 0 4px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;padding:8px 10px;border-radius:9px;font-size:13px;font-weight:700;color:var(--mute);white-space:nowrap}
.seg button.on{background:var(--card2);color:var(--txt)}
#nav{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:rgba(16,18,21,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;gap:4px;align-items:center;z-index:5}
.nb{flex:1;min-width:0;padding:6px 0;border-radius:12px;color:var(--mute);font-size:11px;font-weight:700;text-align:center;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
.nb svg.i{width:23px;height:23px}
.nb.on{color:var(--acc)}
.badge{position:absolute;top:0;left:56%;background:var(--red);color:#fff;border-radius:9px;font-size:10px;font-weight:800;padding:1px 5px;min-width:16px;display:none;font-style:normal}
#nextDay{flex:1.3;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#1a1300;border-radius:15px;padding:9px 4px;font-weight:900;font-size:13px;line-height:1.1;display:flex;flex-direction:column;align-items:center;gap:2px}
#nextDay svg.i{width:20px;height:20px;stroke-width:2.2}
#nextDay small{font-size:10.5px;font-weight:800;opacity:.75}
#nextDay.empty{background:var(--card2);color:var(--mute)}
.sumbox{background:var(--card);border-radius:14px;padding:10px 12px;margin:0 0 12px;text-align:left;font-size:13.5px;color:var(--mute)}
.sumbox div{display:flex;gap:8px;align-items:center;padding:3px 0}.sumbox svg.i{width:16px;height:16px;color:var(--acc)}
.sumbox b{color:var(--txt);margin-left:auto}
.ov{position:fixed;inset:0;z-index:30;display:none;background:rgba(0,0,0,.62)}
.ov.on{display:block}
#sbox{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92vh;overflow-y:auto;background:var(--bg2);border-radius:22px 22px 0 0;padding:12px 14px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 10px}
.hero{border-radius:16px;background:linear-gradient(180deg,#47505f 0%,#2b313b 64%,#1d2128 64.4%,#252a32 100%);padding:16px 0 4px;position:relative;overflow:hidden}
.hero svg.car{width:100%;height:auto;display:block}
.hero .ph{position:absolute;left:10px;top:9px;font-size:11.5px;color:#c9ced8;font-weight:700;display:flex;gap:5px;align-items:center;background:rgba(0,0,0,.3);padding:3px 8px;border-radius:8px}
.hero .ph svg.i{width:14px;height:14px}
.st{font-size:22px;font-weight:900;margin:10px 2px 1px}
.sub{color:var(--mute);font-size:13px;margin:0 2px 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.kv{background:var(--card);border-radius:13px;padding:9px 10px}
.kv small{display:flex;align-items:center;gap:5px;color:var(--mute);font-size:11.5px;font-weight:700}
.kv small svg.i{width:14px;height:14px}
.kv b{font-size:15px}
.bar{height:5px;background:var(--card2);border-radius:5px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%}
.who{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:9px 10px;margin:8px 0}
.who .t{flex:1;min-width:0}.who .t small{display:block;color:var(--mute);font-size:12.5px}
.ava{width:42px;height:42px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;letter-spacing:.02em}
.ava.s{width:36px;height:36px;font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:13px;background:var(--card2);font-weight:800;margin:8px 0;text-align:center}
.btn.y{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#1a1300}
.btn.g{background:var(--green);color:#052914}
.btn.ad{background:linear-gradient(135deg,#5b5cff,#a54dff)}
.btn.tg{background:#2f6ea5}
.btn.r{background:rgba(255,91,91,.13);color:var(--red)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btns .btn{margin:0}
.chk{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:13px;padding:10px;margin:6px 0;width:100%;text-align:left}
.chk .ic{width:36px;height:36px;border-radius:10px;background:var(--card2);display:grid;place-items:center;color:var(--acc);flex:0 0 auto}
.chk .t{flex:1;min-width:0}.chk .t small{display:block;color:var(--mute);font-size:12px}
.chk .p{font-weight:800;font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:4px}
.chk .p svg.i{width:16px;height:16px}
.chk.done{opacity:.75}.chk.done .ic{color:var(--green)}
.hint{color:var(--mute);font-size:12.5px;text-align:center;margin:6px 0}
.hint svg.i{width:15px;height:15px}
.plus{color:var(--green)}.minus{color:var(--red)}
.big{font-size:30px;font-weight:900}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,24px);opacity:0;background:#f4f4f4;color:#141414;font-weight:700;border-radius:14px;padding:10px 14px;z-index:80;transition:.28s;max-width:92vw;font-size:14px;pointer-events:none;display:flex;gap:8px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#modal{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(0,0,0,.7);padding:22px}
#modal.on{display:grid}
#mbox{background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:20px;max-width:380px;width:100%;text-align:center;animation:pop .22s}
@keyframes pop{from{transform:scale(.9);opacity:0}}
#mbox .e{width:64px;height:64px;border-radius:20px;margin:0 auto 4px;display:grid;place-items:center;background:rgba(255,196,0,.12);color:var(--acc)}
#mbox .e svg.i{width:34px;height:34px}
#mbox .e.r{background:rgba(255,91,91,.13);color:var(--red)}#mbox .e.g{background:rgba(53,208,127,.13);color:var(--green)}#mbox .e.b{background:rgba(78,164,255,.13);color:var(--blue)}
#mbox h3{margin:8px 0 4px;font-size:20px}
#mbox p{color:var(--mute);margin:6px 0 12px;text-align:left}
#mbox input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:inherit;margin-bottom:6px;user-select:text;-webkit-user-select:text}
#adscreen{position:fixed;inset:0;background:#000;z-index:90;display:none;place-items:center;color:#fff;font-weight:800;text-align:center}
#adscreen.on{display:grid}
.cl{display:flex;gap:11px;align-items:center;padding:8px 4px 0;width:100%;text-align:left;border-radius:12px}
.cl:active{background:var(--card)}
.cl .ava{width:52px;height:52px;font-size:19px}
.cl .t{flex:1;min-width:0;border-bottom:1px solid #1f2731;padding-bottom:10px}
.cl .nm{display:flex;justify-content:space-between;gap:8px}.cl .nm b{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl .nm span{color:var(--tg-mute);font-size:12.5px;white-space:nowrap}
.cl .ls{display:flex;justify-content:space-between;gap:8px;margin-top:2px;align-items:center}
.cl .ls small{color:var(--tg-mute);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl .ls small em{color:var(--tg-acc);font-style:normal}
.cl .un{background:var(--tg-acc);color:#fff;border-radius:11px;font-size:12px;font-weight:700;padding:0 7px;min-width:22px;text-align:center;height:21px;line-height:21px;flex:0 0 auto}
#chat{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;background:var(--tg-bg);max-width:560px;margin:0 auto}
#chat.on{display:flex}
#chat .hd{display:flex;align-items:center;gap:10px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:var(--tg-head);border-bottom:1px solid #0b1118}
#chat .hd .back{color:var(--tg-acc);padding:6px}
#chat .hd .back svg.i{width:24px;height:24px}
#chat .hd .ava{width:40px;height:40px;font-size:15px}
#chat .hd .t{flex:1;min-width:0}#chat .hd .t b{display:block;font-size:16px}
#chat .hd .t small{color:var(--tg-mute);font-size:13px}
#chat .hd .t small.ty{color:var(--tg-acc)}
#msgs{flex:1;overflow-y:auto;padding:10px 10px 6px;background:radial-gradient(circle at 20% 10%,rgba(94,181,247,.06),transparent 40%),radial-gradient(circle at 80% 70%,rgba(120,90,200,.06),transparent 40%),var(--tg-bg)}
.day{text-align:center;margin:8px 0}.day span{background:rgba(0,0,0,.35);color:#c8d3de;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:12px}
.m{max-width:82%;padding:6px 9px 6px 10px;border-radius:15px;margin:3px 0;font-size:15px;line-height:1.32;position:relative;word-wrap:break-word;width:fit-content;color:#f5f5f5}
.m.in{background:var(--tg-in);border-bottom-left-radius:5px;margin-right:auto}
.m.out{background:var(--tg-out);border-bottom-right-radius:5px;margin-left:auto}
.m .tm{float:right;font-size:11.5px;color:var(--tg-mute);margin:6px 0 -4px 10px;display:inline-flex;align-items:center;gap:2px}
.m.out .tm{color:var(--tg-time-out)}
.m.out .tm svg.i{width:15px;height:15px;stroke:var(--tg-acc);stroke-width:2.2}
.m.ph{padding:3px;max-width:78%;width:78%}
.m.ph .pic{border-radius:12px;background:linear-gradient(180deg,#4b5464 0%,#2c323c 64%,#1d2128 64.4%,#252a32 100%);padding:12px 0 2px;overflow:hidden}
.m.ph .pic svg{width:100%;height:auto;display:block}
.m.ph .cap{padding:5px 7px 3px}
.m.sys{background:rgba(0,0,0,.32);color:#c8d3de;font-size:13px;margin:8px auto;border-radius:12px;text-align:center;max-width:90%}
.m b.sum{color:#ffd76a}
.typing{color:var(--tg-acc);font-size:13px;padding:2px 6px;height:20px}
#kb{background:var(--tg-head);padding:8px 8px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #0b1118}
.kbg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kb{background:rgba(94,181,247,.14);color:#e9f3fb;border-radius:10px;padding:11px 8px;font-size:14px;font-weight:600;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}
.kb.full{grid-column:1/-1}
.kb.g{background:#2f8f5b}.kb.r{background:rgba(255,91,91,.15);color:#ff9b9b}
.kb svg.i{width:17px;height:17px}
.offer{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.offer input{flex:1;accent-color:var(--tg-acc)}
.offer b{min-width:92px;text-align:right;color:#fff}
.send{width:42px;height:42px;border-radius:50%;background:var(--tg-acc);display:grid;place-items:center;color:#fff;flex:0 0 auto}
.closed{color:var(--tg-mute);text-align:center;font-size:13px;padding:8px}
.prof{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:18px;padding:14px;margin-top:10px}
.prof .ava{width:64px;height:64px;font-size:24px}
.prof .t{flex:1;min-width:0}.prof b{font-size:19px;display:flex;gap:6px;align-items:center}
.prof small{display:flex;align-items:center;gap:5px;color:var(--mute);font-size:13px}
.prof small svg.i{width:15px;height:15px}
.ach{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:13px;padding:10px;margin-bottom:7px}
.ach .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,196,0,.13);color:var(--acc);flex:0 0 auto}
.ach.lock{opacity:.45}.ach.lock .ic{background:var(--card2);color:var(--mute)}
.ach .t small{display:block;color:var(--mute);font-size:12px}
.lb{display:flex;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line)}
.lb .n{width:24px;text-align:center;font-weight:900;color:var(--mute)}
.lb.me{background:rgba(255,196,0,.09);border-radius:12px;border-bottom-color:transparent}
.lb .t{flex:1}.lb .t small{display:block;color:var(--mute);font-size:12px}
.chart{display:flex;align-items:flex-end;gap:4px;height:90px;background:var(--card);border-radius:14px;padding:10px}
.chart i{flex:1;background:var(--green);border-radius:3px 3px 0 0;min-height:2px}
.chart i.n{background:var(--red)}
.sw{width:46px;height:28px;border-radius:14px;background:var(--card2);position:relative;transition:.2s;flex:0 0 auto}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--green)}.sw.on:after{left:21px}

#game{position:fixed;inset:0;z-index:45;display:none;flex-direction:column;background:var(--bg);max-width:560px;margin:0 auto}
#game.on{display:flex}
.ghd{display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:var(--bg2)}
.ghd b{flex:1;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghd .pill{gap:4px}.ghd .pill svg.i{width:14px;height:14px}
#gX{color:var(--mute);padding:4px}
.gtimebar{height:4px;background:var(--card)}.gtimebar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));width:100%;transition:width .1s linear}
#garea{flex:1;position:relative;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.gintro{margin:auto;padding:24px;text-align:center;width:100%;max-width:380px}
.gintro p{color:var(--mute)}
.gic{width:70px;height:70px;border-radius:22px;margin:0 auto 10px;display:grid;place-items:center;background:rgba(255,196,0,.13);color:var(--acc)}
.gic svg.i{width:36px;height:36px}.gic.g{background:rgba(53,208,127,.14);color:var(--green)}.gic.r{background:rgba(255,91,91,.14);color:var(--red)}.gic.b{background:rgba(78,164,255,.14);color:var(--blue)}
.gbig{font-size:22px;font-weight:900}
.ghint{color:var(--mute);font-size:13px;text-align:center;margin:10px 12px}
.gb{margin:auto 12px 14px}
.wheel{width:min(82vw,320px);aspect-ratio:1;margin:auto;position:relative}
.wheel .rim{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#5b626d 0 34%,#2a2e35 35% 62%,#16181c 63%);box-shadow:0 0 0 10px #0c0d10 inset}
.wheel .hub{position:absolute;left:50%;top:50%;width:22%;height:22%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#9aa2ad,#4a5059)}
.nut{position:absolute;width:20%;height:20%;transform:translate(-50%,-50%);border-radius:30%;background:linear-gradient(145deg,#c9ced6,#6d747f);transition:transform .12s,opacity .2s;display:grid;place-items:center}
.nut i{width:42%;height:42%;border-radius:50%;background:#3d424a}
.nut.on{box-shadow:0 0 0 4px var(--acc),0 0 22px var(--acc)}
.nut.off{opacity:0;pointer-events:none}
.nut.bad{box-shadow:0 0 0 4px var(--red)}
.scrap{margin:auto;width:min(84vw,330px);background:var(--card);border:2px solid var(--line);border-radius:22px;padding:26px 16px;text-align:center}
.scrap small{color:var(--mute)}
.scrap.in{animation:pop .18s}.scrap.good{border-color:var(--green)}.scrap.wrong{border-color:var(--red)}
#rc{display:block;touch-action:none}
.vf{position:relative;margin:10px 12px;height:180px;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#58627a 0%,#39404e 60%,#23272e 60.5%,#2c3139 100%)}
.vf.flash{background:#fff}
.frame{position:absolute;top:10%;bottom:6%;border:3px solid var(--acc);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.vcar{position:absolute;top:58%;width:46%;transform:translate(-50%,-50%)}
.vcar svg{width:100%;height:auto;display:block}
.pcar{margin:0 12px 9px;width:calc(100% - 24px)}
.pcar .thumb{width:92px;height:56px}.pcar .ci small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.auc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 12px}

 const w=pool.map(m=>m[4]===lv?2.2:m[4]>=lv-2?1.4:.6);let r=Math.random()*w.reduce((a,b)=>a+b),m=pool[0];
 for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0){m=pool[i];break}}

 const realKm=r1k(clamp(age*R(12e3,28e3)*(sl.n==='Рустам'?1.8:1),8e3,520e3));

 Object.assign(c,{seller:si,said:pick(sl.t),age:0,minF:R(sl.min[0],sl.min[1]),pat:sl.pat>=2?3:2,pmax:sl.pat>=2?3:2,city:pick(['Симферополь','Севастополь','Ялта','Евпатория','Феодосия','Керчь','Алушта'])});

function defects(c){const k=c.checks,a=[];if(k.paint&&c.crash)a.push({id:'crash',k:'paint',p:.1,l:'Битая',m:'Толщиномер показал шпаклёвку — машина битая.',r:'Да там чуть-чуть подкрашено… Ладно, скину.'});

 if(k.base&&c.km!==c.kmClaim)a.push({id:'km',k:'base',p:.12,l:'Скручен пробег',m:`По базе пробег ${km(c.km)}, а не ${km(c.kmClaim)}.`,r:'Ну… может прошлый хозяин крутил. Ладно, скидываю.'});
 if(k.base&&c.lien)a.push({id:'lien',k:'base',p:.15,l:'Залог',m:'Машина в залоге у банка. Мне её гасить.',r:'Блин, совсем забыл про кредит… Скину, конечно.'});
 if(k.diag&&c.engine<50)a.push({id:'engine',k:'diag',p:.08,l:'Мотор убит',m:`Диагностика: мотор ${c.engine}%. Капиталка нужна.`,r:'Ну масло ест немного… Ладно, скину.'});
 if(k.diag&&c.gear<50)a.push({id:'gear',k:'diag',p:.06,l:'Коробка пинается',m:`Коробка ${c.gear}%, пинается.`,r:'Коробка с характером, да. Скидываю.'});
 return a}
function knownDisc(c){return defects(c).filter(d=>!(c.used||{})[d.id]).reduce((a,d)=>a+d.p,0)}

 say(ch,{text:d.r+` Новая цена: <b class="sum">${fmt(c.ask)}</b> вместо ${fmt(old)}.`});save()}

function doCheck(c,k){if(c.checks[k])return;const fin=()=>{c.checks[k]=1;S.f.checks++;S.cnt.check=(S.cnt.check||0)+1;if(k==='base'&&c.km!==c.kmClaim)S.cnt.twist=(S.cnt.twist||0)+1;hap('light');achCheck();save();openListing(c.id,true);render();const fd=defects(c).filter(d=>d.k===k||(k==='paint'&&(d.id==='crash'||d.id==='rust'))||(k==='diag'&&(d.id==='engine'||d.id==='gear'))||(k==='base'&&(d.id==='km'||d.id==='lien')));if(fd.length)toast('Нашёл косяк! Используй в торге: −'+Math.round(fd.reduce((a,d)=>a+d.p,0)*100)+'%','search')};

  const PY=H-110;
